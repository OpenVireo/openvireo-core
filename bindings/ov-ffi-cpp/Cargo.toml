[package]
name = "ov-ffi-cpp"
description = "cxx C++ binding of the ov-core facade"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
# staticlib: libovcore.a for the desktop (Corrosion or `cargo xtask cpp`); rlib: Rust tests.
crate-type = ["staticlib", "rlib"]

[dependencies]
ov-core = { path = "../../crates/ov-core" }
ov-crypto = { path = "../../crates/ov-crypto" }
ov-error = { path = "../../crates/ov-error" }
async-trait.workspace = true
cxx.workspace = true
# `executor` for block_on: the bridge's calls block their (worker) thread, see README.md.
futures = { workspace = true, features = ["executor"] }
zeroize.workspace = true

[build-dependencies]
cxx-build.workspace = true

[lints]
workspace = true
