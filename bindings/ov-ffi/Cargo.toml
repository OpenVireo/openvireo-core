[package]
name = "ov-ffi"
description = "UniFFI binding of the ov-core facade (Swift, Kotlin, Python)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "ov_ffi"

[[bin]]
# `uniffi-bindgen`: generates the Swift, Kotlin or Python sources from the built library. Only built with `--features cli`.
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]
# opaque-ke's server steps (`opaque_server_*`), for tests and local mock servers only. Off in release
# builds; `cargo xtask xcframework --test-server` (and `--smoke`) turns it on.
test-server = ["ov-opaque/test-server"]

[dependencies]
ov-core.workspace = true
ov-error.workspace = true
ov-crypto.workspace = true
ov-kdbx.workspace = true
ov-opaque = { workspace = true, default-features = false }
ov-share.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
rand_chacha.workspace = true
serde_json.workspace = true
uniffi.workspace = true
async-trait.workspace = true
futures.workspace = true
zeroize.workspace = true

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
ov-opaque = { workspace = true, default-features = false, features = ["test-server"] }
ov-testkit = { path = "../../crates/ov-testkit" }

[lints]
workspace = true
