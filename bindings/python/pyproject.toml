[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "openvireo"
description = "Python binding of openvireo-core: OpenVireo accounts, vaults, sync and share links"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
authors = [{ name = "OpenVireo", email = "admin@openvireo.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
# The version is the core's (bindings/ov-ffi's Cargo.toml).
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
httpx = ["httpx>=0.27"]
keyring = ["keyring>=24"]

[project.urls]
Homepage = "https://openvireo.com"
Repository = "https://github.com/openvireo/openvireo-core"

[tool.maturin]
# UniFFI mode: maturin builds the ov-ffi cdylib, runs the crate's own uniffi-bindgen (so the
# generator matches the pinned uniffi) and packs the generated module as `openvireo._core`. The
# library is loaded through ctypes, not the CPython ABI, so the wheel is py3-none-<platform>.
bindings = "uniffi"
manifest-path = "../ov-ffi/Cargo.toml"
module-name = "openvireo._core"
python-source = "python"
# Release wheels never enable `test-server` (the opaque_server_* steps). The smoke build adds it
# with `maturin develop --features test-server` (`cargo xtask python --smoke`).
features = []
locked = true
# uniffi-bindgen reads the binding's metadata from the library's symbol table, which a stripped ELF
# (Linux) no longer has: maturin generates the module from the library it ships. So nothing strips
# the symbols, and the release profile drops only the debug info for these builds.
strip = false
config = ['profile.release.strip="debuginfo"']

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"
# generated: the UniFFI module and the stubs (scripts/gen_stubs.py)
extend-exclude = ["python/openvireo/_core", "python/openvireo/__init__.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
# __init__.py is checked on its own (`mypy python/openvireo/__init__.py`, tests/test_stubs.py): with its
# stub in the same run mypy reports a duplicate module.
files = [
    "python/openvireo/hosts.py",
    "python/openvireo/_compat.py",
    "python/openvireo/__init__.pyi",
    "python/openvireo/_core/ov_ffi.pyi",
    "scripts/gen_stubs.py",
    "tests/test_stubs.py",
    "tests/typecheck_sample.py",
]
ignore_missing_imports = true
