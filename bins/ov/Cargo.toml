[package]
name = "ov"
description = "The ov command-line client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

# The library holds the CLI logic so tests (and W3-L3) can drive it without spawning the binary.
[lib]
name = "ov_cli"
path = "src/lib.rs"

[[bin]]
name = "ov"
path = "src/main.rs"

[dependencies]
ov-core = { path = "../../crates/ov-core" }
ov-error = { path = "../../crates/ov-error" }
async-trait.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["std", "error-context"] }
getrandom.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "process", "signal", "sync", "time"] }
zeroize.workspace = true

[lints]
workspace = true
