[package]
name = "ov"
description = "The ov command-line client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

# The library holds the CLI logic so tests can drive it in-process (tests/commands.rs) as well as
# through the binary (tests/binary.rs, tests/cli.rs).
[lib]
name = "ov_cli"
path = "src/lib.rs"

[[bin]]
name = "ov"
path = "src/main.rs"

[dependencies]
ov-core = { path = "../../crates/ov-core" }
ov-error = { path = "../../crates/ov-error" }
async-trait.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["std", "error-context"] }
getrandom.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "process", "signal", "sync", "time"] }
zeroize.workspace = true

[dev-dependencies]
# The in-memory auth and sync servers (W2-E) the CLI tests run against.
ov-testkit = { path = "../../crates/ov-testkit" }
ov-protocol = { path = "../../crates/ov-protocol" }
tokio = { workspace = true, features = ["io-std", "io-util", "net", "process", "signal", "sync", "time", "macros"] }

[target.'cfg(unix)'.dependencies]
# No-echo prompts (termios) and the host name; only in src/tty.rs (contract-v1.4).
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# No-echo prompts on the console (GetConsoleMode / SetConsoleMode); only in src/tty.rs (W3-A3).
windows-sys.workspace = true

[lints]
workspace = true
