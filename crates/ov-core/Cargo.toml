[package]
name = "openvireo-core"
description = "The openvireo-core facade: accounts, vaults, sharing, share links and sync over a platform Host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = true
readme = "../../README.md"
keywords = ["openvireo", "password-manager", "kdbx", "opaque", "e2ee"]
categories = ["cryptography", "authentication"]

[lib]
name = "ov_core"

[dependencies]
ov-error.workspace = true
ov-http.workspace = true
ov-host.workspace = true
ov-crypto.workspace = true
ov-opaque = { workspace = true, default-features = false }
ov-protocol.workspace = true
ov-share.workspace = true
ov-kdbx.workspace = true
ov-merge.workspace = true
ov-sync.workspace = true
ov-vault.workspace = true
async-trait.workspace = true
futures.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[dev-dependencies]
ov-testkit = { path = "../ov-testkit" }
ov-opaque = { workspace = true, default-features = false, features = ["test-server"] }
tokio = { workspace = true }
base64.workspace = true

[lints]
workspace = true
