[package]
name = "ov-crypto"
description = "OpenVireo account cryptography: HKDF, XChaCha20-Poly1305, Argon2, keysets, envelopes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
ov-error = { path = "../ov-error" }
argon2.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
hkdf.workspace = true
sha2.workspace = true
zeroize.workspace = true

# getrandom 0.2 reaches crypto.getRandomValues on wasm32-unknown-unknown only with `js`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["js"] }

[dev-dependencies]
hex.workspace = true
secrecy.workspace = true

[lints]
workspace = true
