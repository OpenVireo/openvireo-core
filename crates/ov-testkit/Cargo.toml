[package]
name = "ov-testkit"
description = "Test helpers for openvireo-core: typed loaders for vectors/, hex helpers, fixed clocks (ov_host::Clock), in-memory auth and sync servers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Test-only: `cargo xtask ci` doesn't build it for wasm32 or iOS.
[package.metadata.ov]
native-only = true

[dependencies]
ov-host.workspace = true
ov-error.workspace = true
ov-protocol.workspace = true
ov-crypto.workspace = true
ov-share.workspace = true
# opaque-ke's server side for the in-memory auth server (servers/).
ov-opaque = { workspace = true, default-features = false, features = ["test-server"] }
async-trait.workspace = true
zeroize.workspace = true
sha2.workspace = true
rand_core.workspace = true
rand_chacha.workspace = true
serde.workspace = true
serde_json.workspace = true
hex = { workspace = true, features = ["std"] }
base64.workspace = true

[lints]
workspace = true
