# cargo deny check: licences, advisories, bans, sources (rust-core-tasks.md §2.6)

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # crypto-bigint 0.5.5 timing issues (patched only in 0.7.6+). It comes in through
  # elliptic-curve 0.13, a dependency of opaque-ke 4.0.1 / voprf 0.5. Our suite is ristretto255:
  # group arithmetic is curve25519-dalek, and the only elliptic-curve code used is hash2curve's
  # expand_message_xmd (hashing). No crypto-bigint function survives linking, and
  # `cargo xtask unlinked` (run by `cargo xtask ci`) fails CI if that ever changes.
  # The real fix is elliptic-curve 0.14, which needs opaque-ke 5 (only 5.0.0-pre.0 exists on
  # 2026-11-15). Remove this ignore when opaque-ke 5 is stable and adopted.
  { id = "RUSTSEC-2026-0387", reason = "no crypto-bigint code is linked (checked by cargo xtask unlinked); fix needs opaque-ke 5" },
  # basic-toml is unmaintained. It comes in through askama -> uniffi_bindgen, i.e. only the
  # uniffi-bindgen host tool behind ov-ffi's `cli` feature; nothing from it is linked into a
  # shipped artifact. Approved 2026-11-15 (W1-BS OWNER-REQUEST).
  { id = "RUSTSEC-2026-0374", reason = "build-time bindgen only (ov-ffi feature cli), nothing linked into artifacts" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]

# UniFFI (the ov-ffi binding) is MPL-2.0: file-level copyleft, shipped unmodified inside the xcframework.
# Allowed only for these crates, so no other MPL crate can slip in. Approved 2026-11-15 (W1-BS).
exceptions = [
  { allow = ["MPL-2.0"], crate = "uniffi" },
  { allow = ["MPL-2.0"], crate = "uniffi_core" },
  { allow = ["MPL-2.0"], crate = "uniffi_macros" },
  { allow = ["MPL-2.0"], crate = "uniffi_internal_macros" },
  { allow = ["MPL-2.0"], crate = "uniffi_meta" },
  { allow = ["MPL-2.0"], crate = "uniffi_bindgen" },
  { allow = ["MPL-2.0"], crate = "uniffi_pipeline" },
  { allow = ["MPL-2.0"], crate = "uniffi_udl" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # Native TLS / OpenSSL would break the wasm and iOS targets; reqwest uses rustls.
  { name = "openssl-sys" },
  { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
